; ESP32-S3 开发板配置，保持原有板型和框架。
[platformio]
build_cache_dir = .pio/build-cache

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32@6.13.0
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
monitor_speed = 115200
monitor_echo = yes
; 编译时生成 gzip 资源，原 web 文件仍是运行资源的唯一来源。
extra_scripts = pre:tools/embed_portal_assets.py
; 农历计算另使用 lib/sxtwl 本地库，不能随参考工程一起删除。
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit GFX Library@1.11.11
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
