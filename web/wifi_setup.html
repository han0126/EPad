<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>四色墨水屏 · 显示设置</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #202422; background: #f5f7f6; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; }
    main { width: min(100%, 720px); padding: 32px 24px 48px; margin: auto; }
    header { border-bottom: 2px solid #202422; padding-bottom: 22px; }
    header p { color: #607067; font-size: 13px; margin: 0 0 8px; }
    h1 { font-size: 25px; line-height: 1.4; margin: 0; }
    h2 { font-size: 17px; margin: 0 0 20px; }
    [hidden] { display: none !important; }
    section { padding: 28px 0; border-bottom: 1px solid #d7dfda; }
    .mode-options { display: flex; flex-wrap: wrap; gap: 12px 28px; border: 0; padding: 0; margin: 0; }
    .mode-options legend { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
    .mode-options label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    .mode-options input { width: 18px; height: 18px; accent-color: #176c46; }
    #mode-state { color: #607067; font-size: 14px; margin: 12px 0 0; }
    .swatches { display: inline-flex; gap: 6px; vertical-align: middle; }
    .swatches span { display: block; width: 18px; height: 18px; border: 1px solid #78847b; }
    .eyebrow { font-size: 13px; color: #607067; margin: 0 0 8px; }
    #device-time { display: block; font: 600 44px/1.25 ui-monospace, Consolas, monospace; min-height: 55px; font-variant-numeric: tabular-nums; }
    #device-date { margin: 8px 0 24px; min-height: 22px; color: #47544c; }
    dl { margin: 0; font-size: 14px; }
    dl div { display: flex; gap: 18px; justify-content: space-between; padding: 10px 0; }
    dt { color: #607067; flex-shrink: 0; }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    #sync-state { color: #176c46; font-weight: 600; }
    #sync-state.error { color: #b02e32; }
    .field { margin-bottom: 20px; }
    label.field-label { display: block; font-size: 14px; margin-bottom: 8px; font-weight: 600; }
    input[type="text"], input[type="password"], input[type="date"], select { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #acb9b1; border-radius: 4px; background: #fff; color: #202422; font: inherit; }
    input:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid #add6c0; outline-offset: 2px; }
    .image-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
    .image-options .field { min-width: 0; margin: 0; }
    #image-file { display: block; width: 100%; min-height: 44px; font: inherit; }
    #image-preview { display: block; width: 100%; max-width: 400px; height: auto; aspect-ratio: 4 / 3; background: #fff; border: 1px solid #acb9b1; margin: 20px auto; image-rendering: pixelated; }
    #image-progress { display: block; width: 100%; height: 12px; margin: 18px 0 8px; accent-color: #176c46; }
    #image-transfer-state { color: #607067; min-height: 22px; font-size: 14px; margin: 8px 0 18px; overflow-wrap: anywhere; }
    .check { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: #47544c; }
    .check input { width: 16px; height: 16px; accent-color: #176c46; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button { min-height: 44px; padding: 10px 16px; border: 1px solid #acb9b1; border-radius: 4px; background: #fff; color: #202422; font: 600 14px/1.5 system-ui, "Microsoft YaHei", sans-serif; cursor: pointer; }
    button.primary { background: #176c46; color: #fff; border-color: #176c46; }
    button:disabled { opacity: .5; cursor: default; }
    #form-error, #calendar-error, #mode-error, #image-error { color: #b02e32; margin: 16px 0 0; font-size: 14px; }
    #form-error:empty, #calendar-error:empty, #mode-error:empty, #image-error:empty { display: none; }
    footer { padding-top: 22px; display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
    #connection { color: #607067; font-size: 13px; margin: 0; }
    @media (max-width: 420px) { main { padding: 24px 18px 36px; } dl div { gap: 12px; } .actions button { flex: 1 1 140px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p>四色墨水屏 · JD79668</p>
      <h1>显示设置</h1>
    </header>

    <section aria-labelledby="mode-heading">
      <fieldset class="mode-options" id="mode-options" disabled>
        <legend id="mode-heading">显示模式</legend>
        <label><input id="mode-calendar" name="display-mode" type="radio" value="calendar" checked>日历显示</label>
        <label><input id="mode-image" name="display-mode" type="radio" value="image">图片展示</label>
      </fieldset>
      <p id="mode-state" role="status">等待设备</p>
      <p id="mode-error" role="alert"></p>
    </section>

    <section id="time-panel" aria-labelledby="time-heading">
      <h2 class="eyebrow" id="time-heading">北京时间 · UTC+8</h2>
      <time id="device-time">--:--:--</time>
      <p id="device-date">等待设备时间</p>
      <dl>
        <div><dt>校时状态</dt><dd id="sync-state" role="status">连接设备中</dd></div>
        <div><dt>上次校时</dt><dd id="last-sync">尚未校时</dd></div>
        <div><dt>时间来源</dt><dd id="time-source">尚未校时</dd></div>
        <div><dt>本次启动</dt><dd id="wake-reason">—</dd></div>
        <div><dt>下次唤醒</dt><dd id="next-wake">等待有效时间</dd></div>
        <div><dt>网络配置</dt><dd id="saved-state">—</dd></div>
        <div><dt>热点关闭倒计时</dt><dd id="remaining">—</dd></div>
      </dl>
    </section>

    <section id="wifi-panel" aria-labelledby="wifi-heading">
      <h2 id="wifi-heading">Wi-Fi 配置</h2>
      <form id="wifi-form">
        <div class="field">
          <label class="field-label" for="ssid">2.4 GHz Wi-Fi 名称</label>
          <input id="ssid" name="ssid" type="text" required maxlength="32" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label class="field-label" for="password">Wi-Fi 密码</label>
          <input id="password" name="password" type="password" maxlength="64" autocomplete="new-password">
          <label class="check"><input id="show-password" type="checkbox">显示密码</label>
        </div>
        <div class="actions">
          <button id="connect" class="primary" type="submit" disabled>连接并保存</button>
          <button id="resync" type="button" disabled>重新校时</button>
        </div>
        <p id="form-error" role="alert"></p>
      </form>
    </section>

    <section id="calendar-panel" aria-labelledby="calendar-heading">
      <h2 id="calendar-heading">日历画面</h2>
      <dl>
        <div><dt>画面日期</dt><dd id="calendar-date">尚未更新</dd></div>
        <div><dt>显示模式</dt><dd id="calendar-mode">实际日期</dd></div>
        <div><dt>刷新状态</dt><dd id="calendar-state" role="status">等待设备</dd></div>
        <div><dt>日期行数</dt><dd id="calendar-rows">—</dd></div>
      </dl>
      <form id="calendar-form">
        <div class="field">
          <label class="field-label" for="preview-date">预览日期</label>
          <input id="preview-date" type="date" min="1901-01-01" max="2099-12-31" required>
        </div>
        <div class="actions">
          <button id="preview" type="submit" disabled>显示指定日期</button>
          <button id="today" type="button" disabled>恢复当前日期</button>
        </div>
        <p id="calendar-error" role="alert"></p>
      </form>
    </section>

    <section id="image-panel" aria-labelledby="image-heading" hidden>
      <h2 id="image-heading">图片展示</h2>
      <dl>
        <div><dt>图片状态</dt><dd id="image-state" role="status">待上传</dd></div>
        <div><dt>设备状态</dt><dd id="image-power-state" role="status">等待图片</dd></div>
        <div><dt>画面尺寸</dt><dd>400 × 300</dd></div>
        <div><dt>显示颜色</dt><dd class="swatches" aria-label="黑、白、红、黄">
          <span style="background:#000" title="黑"></span>
          <span style="background:#fff" title="白"></span>
          <span style="background:#f00" title="红"></span>
          <span style="background:#ff0" title="黄"></span>
        </dd></div>
        <div><dt>热点关闭倒计时</dt><dd id="image-remaining">—</dd></div>
      </dl>
      <form id="image-form">
        <div class="field">
          <label class="field-label" for="image-file">选择图片</label>
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" disabled>
        </div>
        <div class="image-options">
          <div class="field">
            <label class="field-label" for="image-fit">画面适配</label>
            <select id="image-fit" disabled>
              <option value="contain">完整显示</option>
              <option value="cover">铺满裁切</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="image-rotation">旋转</label>
            <select id="image-rotation" disabled>
              <option value="0">0°</option><option value="90">90°</option>
              <option value="180">180°</option><option value="270">270°</option>
            </select>
          </div>
        </div>
        <label class="check"><input id="image-dither" type="checkbox" checked disabled>色彩抖动</label>
        <canvas id="image-preview" width="400" height="300" aria-label="四色图片预览"></canvas>
        <progress id="image-progress" max="100" value="0" aria-label="图片上传进度"></progress>
        <p id="image-transfer-state" role="status">待选择图片</p>
        <div class="actions"><button id="image-send" class="primary" type="submit" disabled>上传并显示</button></div>
        <p id="image-error" role="alert"></p>
      </form>
    </section>

    <footer>
      <p id="connection" role="status">设备未连接</p>
      <button id="close" type="button" disabled>关闭配网</button>
    </footer>
  </main>

  <script src="/image-tools.js"></script>
  <script>
    const elements = Object.fromEntries(
      ['device-time', 'device-date', 'sync-state', 'last-sync', 'saved-state',
       'remaining', 'time-source', 'wake-reason', 'next-wake',
       'wifi-form', 'ssid', 'password', 'show-password',
       'connect', 'resync', 'close', 'form-error', 'connection',
       'calendar-form', 'calendar-date', 'calendar-mode', 'calendar-state',
       'calendar-rows', 'preview-date', 'preview', 'today', 'calendar-error',
       'mode-options', 'mode-calendar', 'mode-image', 'mode-state', 'mode-error',
       'time-panel', 'wifi-panel', 'calendar-panel', 'image-panel', 'image-state',
       'image-form', 'image-file', 'image-fit', 'image-rotation', 'image-dither',
       'image-preview', 'image-progress', 'image-transfer-state', 'image-send',
       'image-error', 'image-remaining', 'image-power-state']
        .map(id => [id, document.getElementById(id)])
    );
    const states = {
      idle: '等待配置', not_configured: '等待配置', connecting: '正在连接 Wi-Fi',
      syncing: '正在同步网络时间', success: '校时成功',
      wifi_error: '无线启动失败', wifi_timeout: 'Wi-Fi 连接超时',
      ntp_timeout: '网络校时超时', save_failed: '已校时，配置保存失败'
    };
    const errors = {
      busy: '当前连接尚未完成，请稍后重试。',
      invalid_credentials: '请核对名称和密码长度；开放网络的密码可留空。',
      no_saved_network: '设备尚无可用的网络配置。',
      session_expired: '配网会话已更新，请刷新页面。',
      invalid_date: '请选择 1901—2099 年内有效的公历日期。',
      display_unavailable: '屏幕正在刷新或显示任务不可用，请稍后重试。',
      invalid_mode: '显示模式无效，请刷新页面。',
      wrong_mode: '请先切换到日历显示。',
      mode_busy: '正在校时或刷新屏幕，请完成后再切换。',
      portal_closing: '热点正在关闭，请复位设备后重新连接。',
      image_mode_required: '请先切换到图片展示。',
      image_busy: '屏幕正在刷新，请完成后再操作。',
      image_header: '图片数据格式或尺寸不正确，请重新选图。',
      image_size: '图片数据不完整，请重新上传。',
      image_checksum: '图片校验失败，请重新上传。',
      image_aborted: '上传已中断，请查看设备状态后重试。',
      image_format: '请选择 PNG、JPEG 或 WebP 图片。',
      image_too_large: '原图不能超过 10 MB。',
      image_dimensions: '原图不能超过 4000 万像素。',
      image_decode: '图片解码失败，请换一张图片重试。',
      image_network: '上传连接中断，请查看设备状态后重试。',
      image_timeout: '上传超时，请查看设备状态后重试。',
      image_response: '设备响应异常，请查看设备状态后重试。',
      image_sleep_pending: '图片已显示，正在进入深睡。',
      image_tools: '图片处理组件未加载，请刷新页面。'
    };
    const calendarStates = { waiting: '等待有效时间', queued: '准备刷新', drawing: '正在刷新', ready: '已更新', error: '刷新失败' };
    const calendarErrors = { task_failed: '显示任务启动失败', calendar_failed: '历法数据生成失败', panel_failed: '屏幕未就绪或刷新超时', invalid_frame: '图片帧格式错误' };
    const imageStates = { inactive: '未选择图片', awaiting_upload: '待上传', receiving: '正在接收', queued: '准备刷新', drawing: '正在刷新', ready: '已显示图片', upload_error: '上传失败', error: '刷新失败' };
    const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    let token = '';
    let saved = false;
    let busy = false;
    let posting = false;
    let online = false;
    let closed = false;
    let clearPasswordAfterSync = false;
    let calendarBusy = false;
    let displayMode = 'calendar';
    let actionRevision = 0;
    let imageFrame = null;
    let imagePreparing = false;
    let imageRevision = 0;
    let imageBusy = false;
    let imageState = 'inactive';
    let imageUploadEnabled = false;
    let waitingForImageResult = false;
    let imageSleepPending = false;

    function updateControls() {
      const isCalendar = displayMode === 'calendar';
      elements['mode-options'].disabled = !online || !token || busy || posting || closed || calendarBusy || imageBusy || imagePreparing || imageSleepPending;
      elements['mode-calendar'].checked = isCalendar;
      elements['mode-image'].checked = !isCalendar;
      elements['time-panel'].hidden = !isCalendar;
      elements['wifi-panel'].hidden = !isCalendar;
      elements['calendar-panel'].hidden = !isCalendar;
      elements['image-panel'].hidden = isCalendar;
      elements['mode-state'].textContent = imageSleepPending
        ? (closed ? '图片已显示，连接已关闭' : '图片已显示，即将深睡')
        : (posting ? '正在处理' :
          (!online ? '等待设备' : (isCalendar ? '日历模式' : (imageStates[imageState] || '图片模式'))));
      const blocked = !online || !token || busy || posting || closed || !isCalendar;
      elements.connect.disabled = blocked;
      elements.resync.disabled = blocked || !saved;
      elements.ssid.disabled = busy || posting || closed;
      elements.password.disabled = busy || posting || closed;
      elements.close.disabled = !online || !token || posting || closed || imageSleepPending || (!isCalendar && imageBusy);
      elements.connect.textContent = busy ? '正在处理…' : '连接并保存';
      const displayBlocked = !online || !token || posting || closed || calendarBusy || !isCalendar;
      elements.preview.disabled = displayBlocked;
      elements.today.disabled = displayBlocked;
      elements['preview-date'].disabled = calendarBusy || posting || closed;
      const imageBlocked = isCalendar || !online || !token || busy || posting || closed || imageBusy || calendarBusy || imagePreparing || imageSleepPending || !imageUploadEnabled;
      for (const id of ['image-file', 'image-fit', 'image-rotation', 'image-dither']) {
        elements[id].disabled = imageBlocked;
      }
      elements['image-send'].disabled = imageBlocked || !imageFrame;
      elements['image-send'].textContent = posting && !isCalendar ? '正在传输…' : '上传并显示';
    }

    async function request(path, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 4500);
      try {
        const response = await fetch(path, { ...options, cache: 'no-store', signal: controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(errors[data.error] || '设备请求失败，请重试。');
        return data;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function poll() {
      if (closed || location.protocol === 'file:') return;
      if (posting) { setTimeout(poll, 1000); return; }
      const revision = actionRevision;
      try {
        const data = await request('/api/status');
        // 操作前发出的旧轮询不能覆盖切换模式后的新状态。
        if (closed || posting || revision !== actionRevision) return;
        online = true;
        token = data.token;
        saved = data.saved;
        // 以设备确认的模式为准，避免请求失败后页面仍停留在另一模式。
        displayMode = data.display.mode;
        busy = data.state === 'connecting' || data.state === 'syncing';
        if (clearPasswordAfterSync && data.state === 'success') {
          elements.password.value = '';
          clearPasswordAfterSync = false;
        }
        // 直接使用单片机返回的时间，不用浏览器本地时钟代替。
        elements['device-time'].textContent = data.valid ? data.time : '--:--:--';
        elements['device-date'].textContent = data.valid
          ? `${data.date}  ${weekdays[data.weekday]}` : '尚未获得有效时间';
        elements['sync-state'].textContent = states[data.state] || '等待设备';
        elements['sync-state'].className = ['wifi_error', 'wifi_timeout', 'ntp_timeout', 'save_failed'].includes(data.state) ? 'error' : '';
        elements['last-sync'].textContent = data.lastSync || '尚未校时';
        const timeSources = { none: '尚未校时', network: '本次网络校准', retained: '深睡保留时钟' };
        elements['time-source'].textContent = timeSources[data.power.timeSource] || '尚未校时';
        elements['wake-reason'].textContent = data.power.timerWake ? '定时唤醒' : '上电或复位';
        elements['next-wake'].textContent = data.power.nextWake ||
          (displayMode === 'image' ? '待图片处理完成' : '无有效时间，一小时后重试');
        imageState = data.display.imageState;
        imageUploadEnabled = data.display.uploadEnabled;
        imageSleepPending = data.power.imageSleepPending;
        imageBusy = ['receiving', 'queued', 'drawing'].includes(imageState);
        elements['image-state'].textContent = errors[data.display.imageError] ||
          calendarErrors[data.display.imageError] || imageStates[imageState] || '等待设备';
        elements['image-power-state'].textContent = imageSleepPending
          ? (data.power.sleepIn ? `即将深睡（${data.power.sleepIn}秒）` : '正在关闭连接')
          : (imageBusy ? '等待刷新完成' :
            (['error', 'upload_error'].includes(imageState) ? '等待重试' : '等待图片'));
        if (waitingForImageResult && imageState === 'ready') {
          waitingForImageResult = false;
          elements['image-transfer-state'].textContent = imageSleepPending
            ? '图片显示完成，即将深睡' : '图片显示完成';
        } else if (waitingForImageResult && ['error', 'upload_error'].includes(imageState)) {
          waitingForImageResult = false;
          elements['image-error'].textContent = errors[data.display.imageError] ||
            calendarErrors[data.display.imageError] || '图片显示失败，请重试。';
        }
        elements['saved-state'].textContent = saved ? '已配置' : '未配置';
        elements.remaining.textContent = `${Math.floor(data.remaining / 60)}分${String(data.remaining % 60).padStart(2, '0')}秒`;
        elements['image-remaining'].textContent = elements.remaining.textContent;
        elements.connection.textContent = data.connected ? '设备已联网' : '已连接设备热点';
        const calendar = data.calendar;
        calendarBusy = calendar.state === 'queued' || calendar.state === 'drawing';
        elements['calendar-date'].textContent = calendar.date || '尚未更新';
        elements['calendar-mode'].textContent = calendar.preview ? '指定日期预览' : '实际日期';
        elements['calendar-state'].textContent = calendarErrors[calendar.error] || calendarStates[calendar.state] || '等待设备';
        elements['calendar-rows'].textContent = calendar.rows ? `${calendar.rows}行` : '—';
        if (!elements['preview-date'].value && data.valid) elements['preview-date'].value = data.date;
      } catch (error) {
        if (closed || posting || revision !== actionRevision) return;
        online = false;
        if (imageSleepPending) {
          // 已收到成功及休眠计划后，关闭无线是预期行为，不再持续重连。
          closed = true;
          elements.connection.textContent = '设备连接已关闭';
          elements['image-power-state'].textContent = '连接已关闭，图片保留';
          elements['image-transfer-state'].textContent = '图片已显示，连接已关闭';
          elements.remaining.textContent = '已关闭';
          elements['image-remaining'].textContent = '已关闭';
          return;
        }
        elements.connection.textContent = '设备暂时不可达';
        elements['sync-state'].textContent = '等待重新连接';
        elements['sync-state'].className = 'error';
      } finally {
        updateControls();
        if (!closed) setTimeout(poll, 1000);
      }
    }

    async function post(path, body) {
      actionRevision += 1;
      posting = true;
      const isCalendar = path.startsWith('/api/calendar/');
      const isMode = path === '/api/display/mode';
      const errorElement = isMode ? elements['mode-error'] :
        (isCalendar ? elements['calendar-error'] :
          (displayMode === 'image' ? elements['image-error'] : elements['form-error']));
      errorElement.textContent = '';
      updateControls();
      try {
        const data = await request(path, {
          method: 'POST',
          headers: { 'X-Portal-Token': token, 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body || ''
        });
        if (path === '/api/close') {
          closed = true;
          online = false;
          elements.connection.textContent = '配网已关闭';
          elements['sync-state'].textContent = '已断开设备';
          elements.remaining.textContent = '已关闭';
        } else if (isMode) {
          displayMode = data.mode;
          calendarBusy = displayMode === 'calendar';
          imageState = displayMode === 'image' ? 'awaiting_upload' : 'inactive';
          imageBusy = false;
          waitingForImageResult = false;
        } else if (isCalendar) {
          calendarBusy = true;
          elements['calendar-state'].textContent = '准备刷新';
        } else {
          busy = true;
          elements['sync-state'].textContent = '正在连接 Wi-Fi';
          clearPasswordAfterSync = path === '/api/wifi';
        }
      } catch (error) {
        errorElement.textContent = error.name === 'AbortError'
          ? '设备暂时未响应，请等待连接恢复。' : error.message;
      } finally {
        posting = false;
        updateControls();
      }
    }

    async function prepareImage() {
      if (imageSleepPending || closed) return;
      const revision = ++imageRevision;
      const file = elements['image-file'].files[0];
      imageFrame = null;
      imagePreparing = true;
      elements['image-error'].textContent = '';
      elements['image-progress'].value = 0;
      elements['image-transfer-state'].textContent = file ? '正在生成四色预览' : '待选择图片';
      const context = elements['image-preview'].getContext('2d');
      if (context) context.clearRect(0, 0, 400, 300);
      updateControls();
      try {
        if (!file) return;
        if (!context) throw new Error('image_decode');
        if (!window.ImageTools) throw new Error('image_tools');
        const result = await window.ImageTools.prepare(file, {
          fit: elements['image-fit'].value,
          rotation: elements['image-rotation'].value,
          dither: elements['image-dither'].checked
        });
        if (revision !== imageRevision || closed) return;
        imageFrame = result.frame;
        context.putImageData(result.preview, 0, 0);
        elements['image-transfer-state'].textContent = '四色预览已就绪 · 30,000 字节';
      } catch (error) {
        if (revision !== imageRevision || closed) return;
        elements['image-error'].textContent = errors[error.message] || '图片处理失败，请重试。';
        elements['image-transfer-state'].textContent = '预览失败';
      } finally {
        if (revision === imageRevision) imagePreparing = false;
        updateControls();
      }
    }

    async function uploadImage() {
      if (!imageFrame || imageBusy || imagePreparing || busy || posting || closed || imageSleepPending || !online || !imageUploadEnabled || displayMode !== 'image') return;
      actionRevision += 1;
      posting = true;
      elements['image-error'].textContent = '';
      elements['image-progress'].value = 0;
      elements['image-transfer-state'].textContent = '正在上传';
      updateControls();
      try {
        if (!window.ImageTools) throw new Error('image_tools');
        const data = window.ImageTools.packet(imageFrame);
        await window.ImageTools.upload(data, token, progress => {
          elements['image-progress'].value = progress;
          elements['image-transfer-state'].textContent = progress < 100
            ? `正在上传 ${progress}%` : '正在等待设备校验';
        });
        imageBusy = true;
        imageState = 'queued';
        waitingForImageResult = true;
        elements['image-state'].textContent = '准备刷新';
        elements['image-transfer-state'].textContent = '校验通过，等待屏幕刷新';
      } catch (error) {
        // 断线或超时不代表设备未收到，先等待下一次状态确认再允许重传。
        imageBusy = true;
        elements['image-error'].textContent = errors[error.message] || '上传失败，请查看设备状态后重试。';
        elements['image-transfer-state'].textContent = '等待确认设备状态';
      } finally {
        posting = false;
        updateControls();
      }
    }

    elements['wifi-form'].addEventListener('submit', event => {
      event.preventDefault();
      // 先读取表单，再禁用输入；名称和密码保持用户输入的原样。
      const body = new URLSearchParams({ ssid: elements.ssid.value, password: elements.password.value });
      post('/api/wifi', body);
    });
    elements.resync.addEventListener('click', () => post('/api/resync'));
    elements.close.addEventListener('click', () => post('/api/close'));
    elements['calendar-form'].addEventListener('submit', event => {
      event.preventDefault();
      const body = new URLSearchParams({ date: elements['preview-date'].value });
      post('/api/calendar/preview', body);
    });
    elements.today.addEventListener('click', () => post('/api/calendar/today'));
    for (const id of ['mode-calendar', 'mode-image']) {
      elements[id].addEventListener('change', event => {
        if (!event.target.checked || event.target.value === displayMode) return;
        const body = new URLSearchParams({ mode: event.target.value });
        post('/api/display/mode', body);
      });
    }
    elements['show-password'].addEventListener('change', event => {
      elements.password.type = event.target.checked ? 'text' : 'password';
    });
    for (const id of ['image-file', 'image-fit', 'image-rotation', 'image-dither']) {
      elements[id].addEventListener('change', prepareImage);
    }
    elements['image-form'].addEventListener('submit', event => {
      event.preventDefault();
      uploadImage();
    });
    poll();
  </script>
</body>
</html>
